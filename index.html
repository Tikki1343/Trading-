<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal ― SL比較トレード日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1219;
    --surface:#171B26;
    --surface-2:#1E2330;
    --surface-3:#262C3B;
    --border:#2B3140;
    --text:#E8EAF1;
    --text-dim:#8A91A6;
    --text-faint:#565D70;
    --win:#3ED9A0;
    --loss:#FF6B7A;
    --be:#F2C46E;
    --acc-a:#5EC8F2;
    --acc-b:#F2A65E;
    --acc-c:#B98CF2;
    --acc-d:#7CE07A;
    --radius:12px;
    --font-d:'Zen Kaku Gothic New',sans-serif;
    --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,200,242,0.07), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(242,166,94,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-d);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(94,200,242,0.3);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px;}

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:44px;height:44px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--acc-a),var(--acc-b));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-m);font-weight:700;font-size:13px;color:#0F1219;
    box-shadow:0 6px 20px -6px rgba(94,200,242,0.5);
  }
  .brand h1{font-size:20px;margin:0 0 3px;font-weight:900;letter-spacing:0.3px;}
  .brand p{margin:0;font-size:12.5px;color:var(--text-dim);}

  .tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border);}
  .tab-btn{
    appearance:none;border:none;background:transparent;color:var(--text-dim);
    font-family:var(--font-d);font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:7px;cursor:pointer;transition:.15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--border) inset;}

  .view{display:none;animation:fadein .25s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h2.section-title{font-size:15px;font-weight:700;color:var(--text-dim);margin:0 0 14px;text-transform:uppercase;letter-spacing:0.08em;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}}

  label{display:block;font-size:12px;color:var(--text-dim);margin:0 0 5px;font-weight:500;}
  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:8px;font-family:var(--font-m);font-size:13.5px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc-a);box-shadow:0 0 0 3px rgba(94,200,242,0.15);}
  textarea{font-family:var(--font-d);resize:vertical;min-height:70px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:720px){.row3{grid-template-columns:1fr 1fr;}}

  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-family:var(--font-m);font-weight:700;font-size:12.5px;cursor:pointer;}
  .seg button.on{background:rgba(94,200,242,0.15);border-color:var(--acc-a);color:var(--acc-a);}
  .seg button.on.long{background:rgba(62,217,160,0.15);border-color:var(--win);color:var(--win);}
  .seg button.on.short{background:rgba(255,107,122,0.15);border-color:var(--loss);color:var(--loss);}

  .tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag-chip{padding:6px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;user-select:none;}
  .tag-chip.on{background:rgba(94,200,242,0.15);border-color:var(--acc-a);color:var(--acc-a);}

  .acc-block{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--surface-2);}
  .acc-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .acc-name-tag{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .toggle{position:relative;width:38px;height:21px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border);cursor:pointer;flex:none;}
  .toggle.on{background:rgba(94,200,242,0.25);border-color:var(--acc-a);}
  .toggle span{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--text-dim);transition:.15s;}
  .toggle.on span{transform:translateX(17px);background:var(--acc-a);}

  .btn{appearance:none;border:none;border-radius:9px;padding:11px 18px;font-family:var(--font-d);font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--acc-a),#4AB8E0);color:#0B0E14;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger{background:rgba(255,107,122,0.12);color:var(--loss);border:1px solid rgba(255,107,122,0.35);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}

  /* ---------- History ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select,.filters input{width:auto;min-width:130px;}
  .trade-card{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .trade-head{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;flex-wrap:wrap;}
  .trade-head:hover{background:var(--surface-2);}
  .trade-date{font-family:var(--font-m);color:var(--text-dim);font-size:12.5px;min-width:88px;}
  .dir-badge{font-family:var(--font-m);font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;}
  .dir-badge.long{background:rgba(62,217,160,0.15);color:var(--win);}
  .dir-badge.short{background:rgba(255,107,122,0.15);color:var(--loss);}
  .trade-tags-mini{font-size:11px;color:var(--text-faint);flex:1;}
  .result-pill{font-family:var(--font-m);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;}
  .result-pill.win{background:rgba(62,217,160,0.15);color:var(--win);}
  .result-pill.lose{background:rgba(255,107,122,0.15);color:var(--loss);}
  .result-pill.be{background:rgba(242,196,110,0.15);color:var(--be);}
  .trade-body{padding:0 16px 16px;border-top:1px solid var(--border);display:none;}
  .trade-body.open{display:block;}
  .rationale-box{background:var(--surface-2);border-radius:8px;padding:12px;margin:12px 0;font-size:13px;line-height:1.6;color:var(--text-dim);white-space:pre-wrap;}
  .compare-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
  .compare-table th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;}
  .compare-table td{padding:8px 10px;border-top:1px solid var(--border);font-family:var(--font-m);}
  .trade-actions{display:flex;gap:8px;margin-top:12px;}
  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty b{color:var(--text-dim);}

  /* ---------- Stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--c,var(--acc-a));}
  .stat-card .acc-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:10px;}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;}
  .stat-row .k{font-size:12px;color:var(--text-faint);}
  .stat-row .v{font-family:var(--font-m);font-weight:700;font-size:15px;}
  .v.pos{color:var(--win);} .v.neg{color:var(--loss);}

  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .chart-head h3{margin:0;font-size:14px;}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend .dot{width:8px;height:8px;}

  /* ---------- Accounts tab ---------- */
  .acc-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface);}
  .acc-row input[type=text]{width:auto;flex:1;}
  .swatch{width:20px;height:20px;border-radius:6px;flex:none;border:2px solid rgba(255,255,255,0.15);cursor:pointer;}
  .swatch-picker{display:flex;gap:6px;}

  footer{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:40px;}

  .img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
  .thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:none;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(10,12,18,0.75);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;padding:0;}
  .thumb-del:hover{background:var(--loss);}
  .file-btn{display:inline-block;position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .hist-images{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .hist-thumb{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;transition:.15s;}
  .hist-thumb:hover{border-color:var(--acc-a);transform:translateY(-1px);}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(8,10,15,0.94);z-index:999;align-items:center;justify-content:center;padding:36px;cursor:zoom-out;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,0.55);}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">SL</div>
      <div>
        <h1>Trade Journal</h1>
        <p>同じエントリーを、建値移動と固定SLで並走させて記録する</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-view="entry">記録</button>
      <button class="tab-btn" data-view="history">履歴</button>
      <button class="tab-btn" data-view="stats">統計</button>
      <button class="tab-btn" data-view="accounts">口座</button>
    </div>
  </div>

  <!-- ================= ENTRY ================= -->
  <div class="view active" id="view-entry">
    <div class="card">
      <h2 class="section-title">新規エントリー記録</h2>

      <div class="grid2">
        <div class="field"><label>日付</label><input type="date" id="f-date"></div>
        <div class="field">
          <label>記録タイプ</label>
          <div class="seg">
            <button type="button" data-type="compare" class="type-btn">口座比較</button>
            <button type="button" data-type="practice" class="type-btn">手法練習（デモ）</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>方向</label>
        <div class="seg">
          <button type="button" data-dir="long" class="dir-btn">LONG</button>
          <button type="button" data-dir="short" class="dir-btn">SHORT</button>
        </div>
      </div>

      <div class="field">
        <label>エントリー根拠</label>
        <textarea id="f-rationale" placeholder="環境認識、狙ったパターン、根拠になったプライスアクションなどを記録"></textarea>
      </div>

      <div class="field">
        <label>チャート画像（スクリーンショット）</label>
        <label class="btn btn-ghost file-btn">
          画像を選択
          <input type="file" id="f-images" accept="image/*" multiple>
        </label>
        <div class="img-preview" id="img-preview"></div>
      </div>

      <h2 class="section-title" style="margin-top:22px;" id="results-heading">口座別の結果</h2>
      <div id="acc-results"></div>
      <div id="practice-result" style="display:none;"></div>

      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn btn-primary" id="btn-save-trade">この記録を保存</button>
        <button class="btn btn-ghost" id="btn-clear-form">クリア</button>
      </div>
    </div>
  </div>

  <!-- ================= HISTORY ================= -->
  <div class="view" id="view-history">
    <div class="filters">
      <select id="fil-account"><option value="">全口座</option></select>
      <select id="fil-result"><option value="">全結果</option><option value="win">勝ち</option><option value="lose">負け</option><option value="be">引き分け</option></select>
      <select id="fil-type"><option value="">全タイプ</option><option value="compare">口座比較</option><option value="practice">手法練習</option></select>
    </div>
    <div id="trade-list"></div>
  </div>

  <!-- ================= STATS ================= -->
  <div class="view" id="view-stats">
    <h2 class="section-title">口座別サマリー</h2>
    <div class="stat-grid" id="stat-grid"></div>

    <div class="chart-card">
      <div class="chart-head">
        <h3>累積R推移（エクイティカーブ）</h3>
        <div class="legend" id="curve-legend"></div>
      </div>
      <svg id="curve-svg" width="100%" height="280" viewBox="0 0 1000 280" preserveAspectRatio="none"></svg>
    </div>

    <div class="chart-card">
      <div class="chart-head"><h3>勝率比較</h3></div>
      <svg id="wr-svg" width="100%" height="180" viewBox="0 0 1000 180" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <!-- ================= ACCOUNTS ================= -->
  <div class="view" id="view-accounts">
    <h2 class="section-title">口座管理</h2>
    <div id="acc-list"></div>
    <button class="btn btn-primary" id="btn-add-acc" style="margin-top:8px;">口座を追加</button>

    <h2 class="section-title" style="margin-top:30px;">バックアップ</h2>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-ghost" id="btn-export">JSONエクスポート</button>
      <label class="btn btn-ghost" style="position:relative;overflow:hidden;">
        JSONインポート
        <input type="file" id="import-file" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      </label>
    </div>
  </div>

  <footer>データはこのブラウザの localStorage に保存されます。他端末とは共有されません。</footer>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src=""></div>

<script>
/* ==================== State ==================== */
const PALETTE = ["#5EC8F2","#F2A65E","#B98CF2","#7CE07A","#F27C9E","#7CD9E0"];

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let accounts = load('tj_accounts', null);
if(!accounts){
  accounts = [
    {id:'acc_be', name:'建値移動口座', note:'含み益が乗ったら早めにSLを建値へ', color:'#5EC8F2'},
    {id:'acc_fixed', name:'SL固定口座', note:'当初のSLを動かさずTP/損切りまで保持', color:'#F2A65E'}
  ];
  save('tj_accounts', accounts);
}
let trades = load('tj_trades', []);

let selectedDir = 'long';
let selectedRecordType = 'compare';
let stagedImages = [];

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderImgPreview(){
  const wrap = document.getElementById('img-preview');
  wrap.innerHTML = '';
  stagedImages.forEach((src, idx)=>{
    const box = document.createElement('div');
    box.className = 'thumb';
    box.innerHTML = `<img src="${src}"><button type="button" class="thumb-del" data-idx="${idx}">×</button>`;
    box.querySelector('.thumb-del').addEventListener('click', ()=>{
      stagedImages.splice(idx,1);
      renderImgPreview();
    });
    wrap.appendChild(box);
  });
}

document.getElementById('f-images').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files);
  for(const file of files){
    try{
      const dataUrl = await fileToDataUrl(file);
      stagedImages.push(dataUrl);
    }catch(err){ /* skip unreadable file */ }
  }
  e.target.value = '';
  renderImgPreview();
});

/* ==================== Tabs ==================== */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='history') renderHistory();
    if(btn.dataset.view==='stats') renderStats();
    if(btn.dataset.view==='accounts') renderAccountsTab();
  });
});

/* ==================== Entry form ==================== */
function initEntryForm(){
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

  document.querySelectorAll('.dir-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      selectedDir = b.dataset.dir;
      document.querySelectorAll('.dir-btn').forEach(x=>x.classList.remove('on','long','short'));
      b.classList.add('on', selectedDir);
    });
  });
  document.querySelector('.dir-btn[data-dir="long"]').click();

  document.querySelectorAll('.type-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      selectedRecordType = b.dataset.type;
      document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const isCompare = selectedRecordType === 'compare';
      document.getElementById('acc-results').style.display = isCompare ? '' : 'none';
      document.getElementById('practice-result').style.display = isCompare ? 'none' : '';
      document.getElementById('results-heading').textContent = isCompare ? '口座別の結果' : '結果';
    });
  });
  document.querySelector('.type-btn[data-type="compare"]').click();

  renderAccResultBlocks();
  renderPracticeResultBlock();
}

function renderAccResultBlocks(){
  const wrap = document.getElementById('acc-results');
  wrap.innerHTML = '';
  accounts.forEach(acc=>{
    const block = document.createElement('div');
    block.className = 'acc-block';
    block.dataset.accId = acc.id;
    block.innerHTML = `
      <div class="acc-block-head">
        <div class="acc-name-tag"><span class="dot" style="background:${acc.color}"></span>${escapeHtml(acc.name)}</div>
        <div class="toggle on" data-role="toggle"><span></span></div>
      </div>
      <div class="acc-fields">
        <div class="row3">
          <div class="field">
            <label>SL運用</label>
            <select data-role="sltype">
              <option value="breakeven">建値へ移動</option>
              <option value="fixed">固定のまま</option>
            </select>
          </div>
          <div class="field">
            <label>結果</label>
            <select data-role="result">
              <option value="win">勝ち</option>
              <option value="lose">負け</option>
              <option value="be">引き分け</option>
            </select>
          </div>
          <div class="field"><label>R倍率</label><input type="number" step="any" data-role="r"></div>
        </div>
        <div class="row3">
          <div class="field"><label>損益額（任意）</label><input type="number" step="any" data-role="pnl"></div>
          <div class="field" style="grid-column:span 2;"><label>メモ</label><input type="text" data-role="memo" placeholder="この口座だけの所感"></div>
        </div>
      </div>
    `;
    // default SL type: breakeven-named accounts default to breakeven, others fixed, purely a UX nicety
    const slSel = block.querySelector('[data-role="sltype"]');
    if(/固定/.test(acc.name)) slSel.value = 'fixed';

    const toggle = block.querySelector('[data-role="toggle"]');
    const fieldsBox = block.querySelector('.acc-fields');
    toggle.addEventListener('click', ()=>{
      toggle.classList.toggle('on');
      fieldsBox.style.display = toggle.classList.contains('on') ? '' : 'none';
    });

    wrap.appendChild(block);
  });
}

document.getElementById('btn-clear-form').addEventListener('click', ()=>{
  document.getElementById('f-rationale').value='';
  stagedImages = [];
  renderImgPreview();
  renderAccResultBlocks();
  renderPracticeResultBlock();
});

document.getElementById('btn-save-trade').addEventListener('click', ()=>{
  const date = document.getElementById('f-date').value;
  const rationale = document.getElementById('f-rationale').value.trim();

  if(!date){ alert('日付は必須です。'); return; }

  let results = {};

  if(selectedRecordType === 'compare'){
    document.querySelectorAll('#acc-results .acc-block').forEach(block=>{
      const toggle = block.querySelector('[data-role="toggle"]');
      if(!toggle.classList.contains('on')) return;
      const accId = block.dataset.accId;
      results[accId] = {
        slType: block.querySelector('[data-role="sltype"]').value,
        result: block.querySelector('[data-role="result"]').value,
        r: block.querySelector('[data-role="r"]').value ? parseFloat(block.querySelector('[data-role="r"]').value) : null,
        pnl: block.querySelector('[data-role="pnl"]').value ? parseFloat(block.querySelector('[data-role="pnl"]').value) : null,
        memo: block.querySelector('[data-role="memo"]').value.trim()
      };
    });
    if(Object.keys(results).length === 0){ alert('少なくとも1つの口座を有効にしてください。'); return; }
  } else {
    const accId = document.getElementById('pr-account').value;
    if(!accId){ alert('口座を選択してください。'); return; }
    results[accId] = {
      slType: null,
      result: document.getElementById('pr-result').value,
      r: document.getElementById('pr-r').value ? parseFloat(document.getElementById('pr-r').value) : null,
      pnl: document.getElementById('pr-pnl').value ? parseFloat(document.getElementById('pr-pnl').value) : null,
      memo: document.getElementById('pr-memo').value.trim()
    };
  }

  const trade = {
    id: 't_' + Date.now(),
    date,
    recordType: selectedRecordType,
    direction: selectedDir,
    rationale,
    images: [...stagedImages],
    results
  };
  trades.push(trade);
  save('tj_trades', trades);
  document.getElementById('btn-clear-form').click();
  alert('記録を保存しました。');
});

/* ==================== History ==================== */
function populateAccountFilter(){
  const sel = document.getElementById('fil-account');
  sel.innerHTML = '<option value="">全口座</option>' + accounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
}

['fil-account','fil-result','fil-type'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderHistory);
});

function renderHistory(){
  populateAccountFilter();
  const accFilter = document.getElementById('fil-account').value;
  const resFilter = document.getElementById('fil-result').value;
  const typeFilter = document.getElementById('fil-type').value;

  let list = [...trades].sort((a,b)=> b.date.localeCompare(a.date));
  if(typeFilter) list = list.filter(t=> (t.recordType||'compare') === typeFilter);
  if(accFilter) list = list.filter(t=> t.results[accFilter]);
  if(resFilter) list = list.filter(t=> Object.values(t.results).some(r=>r.result===resFilter));

  const container = document.getElementById('trade-list');
  container.innerHTML = '';

  if(list.length===0){
    container.innerHTML = `<div class="empty">記録がまだありません。<br><b>「記録」タブ</b>からエントリーを追加してください。</div>`;
    return;
  }

  list.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'trade-card';
    const resultsArr = accounts.filter(a=>t.results[a.id]).map(a=>({acc:a, r:t.results[a.id]}));
    const isCompare = (t.recordType||'compare') === 'compare';

    card.innerHTML = `
      <div class="trade-head">
        <div class="trade-date">${t.date}</div>
        <div class="dir-badge ${t.direction}">${t.direction.toUpperCase()}</div>
        <span class="tag-chip" style="cursor:default;">${isCompare ? '口座比較' : '手法練習'}</span>
        ${resultsArr.map(x=>`<span class="result-pill ${x.r.result}">${escapeHtml(x.acc.name)}: ${resultLabel(x.r.result)}</span>`).join('')}
      </div>
      <div class="trade-body">
        <div class="rationale-box">${escapeHtml(t.rationale || '（根拠の記載なし）')}</div>
        ${t.images && t.images.length ? `<div class="hist-images">${t.images.map(src=>`<img src="${src}" class="hist-thumb" data-full="${src}">`).join('')}</div>` : ''}
        <table class="compare-table">
          <thead><tr><th>口座</th><th>SL運用</th><th>結果</th><th>R</th><th>損益</th><th>メモ</th></tr></thead>
          <tbody>
            ${resultsArr.map(x=>`
              <tr>
                <td><span class="dot" style="display:inline-block;background:${x.acc.color};margin-right:6px;"></span>${escapeHtml(x.acc.name)}</td>
                <td>${x.r.slType==='breakeven'?'建値移動':x.r.slType==='fixed'?'固定':'—'}</td>
                <td><span class="result-pill ${x.r.result}">${resultLabel(x.r.result)}</span></td>
                <td class="${rClass(x.r.r)}">${x.r.r!=null ? (x.r.r>0?'+':'')+x.r.r.toFixed(2)+'R' : '—'}</td>
                <td>${x.r.pnl!=null ? x.r.pnl : '—'}</td>
                <td>${escapeHtml(x.r.memo||'—')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="trade-actions">
          <button class="btn btn-danger btn-sm" data-del="${t.id}">削除</button>
        </div>
      </div>
    `;
    card.querySelector('.trade-head').addEventListener('click', ()=>{
      card.querySelector('.trade-body').classList.toggle('open');
    });
    card.querySelector('[data-del]').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('この記録を削除しますか？')){
        trades = trades.filter(x=>x.id!==t.id);
        save('tj_trades', trades);
        renderHistory();
      }
    });
    container.appendChild(card);
  });
}

function resultLabel(r){ return r==='win'?'勝ち':r==='lose'?'負け':'引分'; }
function rClass(r){ if(r==null) return ''; return r>0?'v pos':r<0?'v neg':''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ==================== Stats ==================== */
function computeAccountStats(accId){
  const rows = trades.filter(t=>t.results[accId]).map(t=>({date:t.date, ...t.results[accId]}));
  const total = rows.length;
  const wins = rows.filter(r=>r.result==='win').length;
  const losses = rows.filter(r=>r.result==='lose').length;
  const rVals = rows.filter(r=>r.r!=null).map(r=>r.r);
  const totalR = rVals.reduce((a,b)=>a+b,0);
  const avgR = rVals.length ? totalR/rVals.length : 0;
  const grossWin = rVals.filter(r=>r>0).reduce((a,b)=>a+b,0);
  const grossLoss = Math.abs(rVals.filter(r=>r<0).reduce((a,b)=>a+b,0));
  const pf = grossLoss>0 ? grossWin/grossLoss : (grossWin>0 ? Infinity : 0);
  const winRate = total>0 ? wins/total*100 : 0;
  // sorted cumulative curve
  const sorted = [...rows].sort((a,b)=>a.date.localeCompare(b.date));
  let cum = 0;
  const curve = sorted.map(r=>{ cum += (r.r||0); return cum; });
  return {total, wins, losses, winRate, totalR, avgR, pf, curve};
}

function renderStats(){
  const grid = document.getElementById('stat-grid');
  grid.innerHTML = '';
  const statsByAcc = {};
  accounts.forEach(acc=>{
    const s = computeAccountStats(acc.id);
    statsByAcc[acc.id] = s;
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.style.setProperty('--c', acc.color);
    card.innerHTML = `
      <div class="acc-label"><span class="dot" style="background:${acc.color}"></span>${escapeHtml(acc.name)}</div>
      <div class="stat-row"><span class="k">トレード数</span><span class="v">${s.total}</span></div>
      <div class="stat-row"><span class="k">勝率</span><span class="v ${s.winRate>=50?'pos':'neg'}">${s.winRate.toFixed(1)}%</span></div>
      <div class="stat-row"><span class="k">合計R</span><span class="v ${s.totalR>0?'pos':s.totalR<0?'neg':''}">${s.totalR>0?'+':''}${s.totalR.toFixed(2)}R</span></div>
      <div class="stat-row"><span class="k">平均R</span><span class="v ${s.avgR>0?'pos':s.avgR<0?'neg':''}">${s.avgR>0?'+':''}${s.avgR.toFixed(2)}R</span></div>
      <div class="stat-row"><span class="k">プロフィットファクター</span><span class="v">${s.pf===Infinity?'∞':s.pf.toFixed(2)}</span></div>
    `;
    grid.appendChild(card);
  });

  renderCurveChart(statsByAcc);
  renderWinRateChart(statsByAcc);
}

function renderCurveChart(statsByAcc){
  const svg = document.getElementById('curve-svg');
  const legend = document.getElementById('curve-legend');
  svg.innerHTML = '';
  legend.innerHTML = accounts.map(a=>`<span><span class="dot" style="background:${a.color}"></span>${escapeHtml(a.name)}</span>`).join('');

  const W=1000,H=280,PAD=30;
  let allVals = [0];
  accounts.forEach(a=>{ statsByAcc[a.id].curve.forEach(v=>allVals.push(v)); });
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals, -1);
  const range = (maxV-minV) || 1;

  const yFor = v => H-PAD - ((v-minV)/range)*(H-PAD*2);
  const zeroY = yFor(0);
  // zero line
  const zeroLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  zeroLine.setAttribute('x1',PAD); zeroLine.setAttribute('x2',W-PAD);
  zeroLine.setAttribute('y1',zeroY); zeroLine.setAttribute('y2',zeroY);
  zeroLine.setAttribute('stroke','#2B3140'); zeroLine.setAttribute('stroke-dasharray','4,4');
  svg.appendChild(zeroLine);

  let hasAny = false;
  accounts.forEach(a=>{
    const curve = statsByAcc[a.id].curve;
    if(curve.length===0) return;
    hasAny = true;
    const n = curve.length;
    const xStep = n>1 ? (W-PAD*2)/(n-1) : 0;
    let d = `M ${PAD} ${yFor(0)} `;
    curve.forEach((v,i)=>{ d += `L ${PAD + i*xStep} ${yFor(v)} `; });
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', a.color);
    path.setAttribute('stroke-width','2.5');
    path.setAttribute('stroke-linejoin','round');
    svg.appendChild(path);
  });

  if(!hasAny){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', W/2); t.setAttribute('y', H/2);
    t.setAttribute('fill','#565D70'); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','14');
    t.textContent = 'まだデータがありません';
    svg.appendChild(t);
  }
}

function renderWinRateChart(statsByAcc){
  const svg = document.getElementById('wr-svg');
  svg.innerHTML = '';
  const W=1000,H=180,PAD=30;
  const barH = 34, gap = 20;
  let y = 20;
  accounts.forEach(a=>{
    const s = statsByAcc[a.id];
    const barW = Math.max(0, (s.winRate/100) * (W-160));
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', 0); label.setAttribute('y', y+barH/2+5);
    label.setAttribute('fill','#8A91A6'); label.setAttribute('font-size','13');
    label.textContent = a.name;
    g.appendChild(label);

    const track = document.createElementNS('http://www.w3.org/2000/svg','rect');
    track.setAttribute('x',150); track.setAttribute('y', y);
    track.setAttribute('width', W-160-30); track.setAttribute('height', barH);
    track.setAttribute('rx', 6); track.setAttribute('fill','#1E2330');
    g.appendChild(track);

    const bar = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bar.setAttribute('x',150); bar.setAttribute('y', y);
    bar.setAttribute('width', barW); bar.setAttribute('height', barH);
    bar.setAttribute('rx', 6); bar.setAttribute('fill', a.color);
    g.appendChild(bar);

    const pct = document.createElementNS('http://www.w3.org/2000/svg','text');
    pct.setAttribute('x', 160+ (W-160-30)); pct.setAttribute('y', y+barH/2+5);
    pct.setAttribute('fill','#E8EAF1'); pct.setAttribute('font-size','13'); pct.setAttribute('text-anchor','end');
    pct.textContent = s.winRate.toFixed(1)+'% ('+s.wins+'/'+s.total+')';
    g.appendChild(pct);

    svg.appendChild(g);
    y += barH + gap;
  });
  svg.setAttribute('height', Math.max(180, y+10));
  svg.setAttribute('viewBox', `0 0 ${W} ${Math.max(180,y+10)}`);
}

/* ==================== Accounts tab ==================== */
function renderAccountsTab(){
  const list = document.getElementById('acc-list');
  list.innerHTML = '';
  accounts.forEach(acc=>{
    const row = document.createElement('div');
    row.className = 'acc-row';
    row.innerHTML = `
      <div class="swatch-picker">
        ${PALETTE.map(c=>`<div class="swatch" data-color="${c}" style="background:${c};${c===acc.color?'box-shadow:0 0 0 2px #fff;':''}"></div>`).join('')}
      </div>
      <input type="text" value="${escapeHtml(acc.name)}" data-role="name">
      <input type="text" value="${escapeHtml(acc.note||'')}" data-role="note" placeholder="運用メモ">
      <button class="btn btn-danger btn-sm" data-role="del">削除</button>
    `;
    row.querySelectorAll('.swatch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        acc.color = sw.dataset.color;
        save('tj_accounts', accounts);
        renderAccountsTab();
      });
    });
    row.querySelector('[data-role="name"]').addEventListener('change', e=>{
      acc.name = e.target.value.trim() || acc.name;
      save('tj_accounts', accounts);
    });
    row.querySelector('[data-role="note"]').addEventListener('change', e=>{
      acc.note = e.target.value.trim();
      save('tj_accounts', accounts);
    });
    row.querySelector('[data-role="del"]').addEventListener('click', ()=>{
      if(accounts.length<=1){ alert('口座は最低1つ必要です。'); return; }
      if(!confirm(`「${acc.name}」を削除しますか？既存の記録に残る結果データはそのまま保持されます。`)) return;
      accounts = accounts.filter(a=>a.id!==acc.id);
      save('tj_accounts', accounts);
      renderAccountsTab();
    });
    list.appendChild(row);
  });
}

document.getElementById('btn-add-acc').addEventListener('click', ()=>{
  const name = prompt('新しい口座名を入力してください', '新規口座');
  if(!name) return;
  const color = PALETTE[accounts.length % PALETTE.length];
  accounts.push({id:'acc_'+Date.now(), name: name.trim(), note:'', color});
  save('tj_accounts', accounts);
  renderAccountsTab();
  renderAccResultBlocks();
  renderPracticeResultBlock();
});

document.getElementById('btn-export').addEventListener('click', ()=>{
  const data = JSON.stringify({accounts, trades}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `trade-journal-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('現在のデータを上書きしてインポートしますか？')) return;
      if(data.accounts) { accounts = data.accounts; save('tj_accounts', accounts); }
      if(data.trades) { trades = data.trades; save('tj_trades', trades); }
      renderAccountsTab();
      renderAccResultBlocks();
      renderPracticeResultBlock();
      alert('インポートしました。');
    }catch(err){
      alert('ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。');
    }
  };
  reader.readAsText(file);
});

  if(e.target.classList.contains('hist-thumb')){
    document.getElementById('lightbox-img').src = e.target.dataset.full;
    document.getElementById('lightbox').classList.add('open');
  }
});
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('open');
