<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal ― トレード日誌</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjNUVDOEYyIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI0YyQTY1RSIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9InVybCgjZykiLz4KICA8dGV4dCB4PSIzMiIgeT0iNDEiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjcwMCIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzBGMTIxOSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+U0w8L3RleHQ+Cjwvc3ZnPgo=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0F1219;
    --surface:#171B26;
    --surface-2:#1E2330;
    --surface-3:#262C3B;
    --border:#2B3140;
    --text:#E8EAF1;
    --text-dim:#8A91A6;
    --text-faint:#565D70;
    --win:#3ED9A0;
    --loss:#FF6B7A;
    --be:#F2C46E;
    --accent:#5EC8F2;
    --accent2:#F2A65E;
    --radius:12px;
    --font-d:'Zen Kaku Gothic New',sans-serif;
    --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(94,200,242,0.07), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(242,166,94,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-d);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(94,200,242,0.3);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:44px;height:44px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-m);font-weight:700;font-size:13px;color:#0F1219;
    box-shadow:0 6px 20px -6px rgba(94,200,242,0.5);
  }
  .brand h1{font-size:20px;margin:0 0 3px;font-weight:900;letter-spacing:0.3px;}
  .brand p{margin:0;font-size:12.5px;color:var(--text-dim);}

  .tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border);}
  .tab-btn{
    appearance:none;border:none;background:transparent;color:var(--text-dim);
    font-family:var(--font-d);font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:7px;cursor:pointer;transition:.15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--border) inset;}

  .view{display:none;animation:fadein .25s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h2.section-title{font-size:15px;font-weight:700;color:var(--text-dim);margin:0 0 14px;text-transform:uppercase;letter-spacing:0.08em;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}}

  label{display:block;font-size:12px;color:var(--text-dim);margin:0 0 5px;font-weight:500;}
  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:8px;font-family:var(--font-m);font-size:13.5px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,200,242,0.15);}
  textarea{font-family:var(--font-d);resize:vertical;min-height:70px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:720px){.row3{grid-template-columns:1fr 1fr;}}

  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-family:var(--font-m);font-weight:700;font-size:12.5px;cursor:pointer;}
  .seg button.on{background:rgba(94,200,242,0.15);border-color:var(--accent);color:var(--accent);}
  .seg button.on.long{background:rgba(62,217,160,0.15);border-color:var(--win);color:var(--win);}
  .seg button.on.short{background:rgba(255,107,122,0.15);border-color:var(--loss);color:var(--loss);}

  .tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag-chip{padding:6px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;user-select:none;}
  .tag-chip.on{background:rgba(94,200,242,0.15);border-color:var(--accent);color:var(--accent);}

  .btn{appearance:none;border:none;border-radius:9px;padding:11px 18px;font-family:var(--font-d);font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#4AB8E0);color:#0B0E14;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger{background:rgba(255,107,122,0.12);color:var(--loss);border:1px solid rgba(255,107,122,0.35);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}

  .img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
  .thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:none;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(10,12,18,0.75);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;padding:0;}
  .thumb-del:hover{background:var(--loss);}
  .file-btn{display:inline-block;position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .hist-images{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .hist-thumb{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;transition:.15s;}
  .hist-thumb:hover{border-color:var(--accent);transform:translateY(-1px);}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(8,10,15,0.94);z-index:999;align-items:center;justify-content:center;padding:36px;cursor:zoom-out;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,0.55);}

  .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;}

  /* ---------- History ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select{width:auto;min-width:130px;}
  .trade-card{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .trade-head{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;flex-wrap:wrap;}
  .trade-head:hover{background:var(--surface-2);}
  .trade-date{font-family:var(--font-m);color:var(--text-dim);font-size:12.5px;min-width:88px;}
  .dir-badge{font-family:var(--font-m);font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;}
  .dir-badge.long{background:rgba(62,217,160,0.15);color:var(--win);}
  .dir-badge.short{background:rgba(255,107,122,0.15);color:var(--loss);}
  .acc-badge{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-dim);}
  .result-pill{font-family:var(--font-m);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;}
  .result-pill.win{background:rgba(62,217,160,0.15);color:var(--win);}
  .result-pill.lose{background:rgba(255,107,122,0.15);color:var(--loss);}
  .result-pill.be{background:rgba(242,196,110,0.15);color:var(--be);}
  .trade-r{font-family:var(--font-m);font-weight:700;font-size:12.5px;}
  .trade-body{padding:0 16px 16px;border-top:1px solid var(--border);display:none;}
  .trade-body.open{display:block;}
  .rationale-box{background:var(--surface-2);border-radius:8px;padding:12px;margin:12px 0;font-size:13px;line-height:1.6;color:var(--text-dim);white-space:pre-wrap;}
  .memo-box{font-size:12.5px;color:var(--text-dim);margin-top:6px;}
  .trade-actions{display:flex;gap:8px;margin-top:12px;}
  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty b{color:var(--text-dim);}

  /* ---------- Stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--c,var(--accent));}
  .stat-card .acc-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:10px;}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;}
  .stat-row .k{font-size:12px;color:var(--text-faint);}
  .stat-row .v{font-family:var(--font-m);font-weight:700;font-size:15px;}
  .v.pos{color:var(--win);} .v.neg{color:var(--loss);}

  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .chart-head h3{margin:0;font-size:14px;}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .bal-controls{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;}
  .bal-field{max-width:220px;}
  .bal-field label{margin-bottom:4px;}
  .bal-field input{font-size:13px;padding:7px 10px;}

  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .cal-nav-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:17px;line-height:1;}
  .cal-nav-btn:hover{color:var(--text);border-color:var(--accent);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-weekday{text-align:center;font-size:10.5px;color:var(--text-faint);font-weight:700;padding:2px 0 6px;}
  .cal-cell{min-height:64px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);padding:5px 6px;font-size:10.5px;overflow:hidden;}
  .cal-blank{background:transparent;border:none;}
  .cal-day-num{font-weight:700;color:var(--text-faint);margin-bottom:2px;font-family:var(--font-m);font-size:11px;}
  .cal-pnl{font-family:var(--font-m);font-weight:700;font-size:12px;line-height:1.3;}
  .cal-r{font-family:var(--font-m);font-size:10px;color:var(--text-dim);line-height:1.3;}
  .cal-wl{font-size:9.5px;color:var(--text-faint);margin-top:2px;line-height:1.3;}
  .cal-pos{background:rgba(62,217,160,0.10);border-color:rgba(62,217,160,0.3);}
  .cal-pos .cal-day-num{color:var(--win);}
  .cal-pos .cal-pnl{color:var(--win);}
  .cal-neg{background:rgba(255,107,122,0.10);border-color:rgba(255,107,122,0.3);}
  .cal-neg .cal-day-num{color:var(--loss);}
  .cal-neg .cal-pnl{color:var(--loss);}
  @media(max-width:520px){
    .cal-cell{min-height:52px;padding:4px;font-size:9px;}
    .cal-pnl{font-size:10px;}
  }

  /* ---------- Accounts tab ---------- */
  .acc-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface);flex-wrap:wrap;}
  .acc-row input[type=text]{width:auto;flex:1;min-width:140px;}
  .swatch{width:20px;height:20px;border-radius:6px;flex:none;border:2px solid rgba(255,255,255,0.15);cursor:pointer;}
  .swatch-picker{display:flex;gap:6px;}

  footer{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">TJ</div>
      <div>
        <h1>Trade Journal</h1>
        <p>過去検証とリアルタイムのトレードを口座ごとに記録</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-view="entry">記録</button>
      <button class="tab-btn" data-view="history">履歴</button>
      <button class="tab-btn" data-view="stats">統計</button>
      <button class="tab-btn" data-view="accounts">口座</button>
    </div>
  </div>

  <!-- ================= ENTRY ================= -->
  <div class="view active" id="view-entry">
    <div class="card">
      <h2 class="section-title">新規トレード記録</h2>

      <div class="grid2">
        <div class="field"><label>日付</label><input type="date" id="f-date"></div>
        <div class="field"><label>口座</label><select id="f-account"></select></div>
      </div>

      <div class="field">
        <label>方向</label>
        <div class="seg">
          <button type="button" data-dir="long" class="dir-btn">LONG</button>
          <button type="button" data-dir="short" class="dir-btn">SHORT</button>
        </div>
      </div>

      <div class="field">
        <label>エントリー根拠</label>
        <textarea id="f-rationale" placeholder="環境認識、狙ったパターン、根拠になったプライスアクションなどを記録"></textarea>
      </div>

      <div class="field">
        <label>チャート画像（スクリーンショット）</label>
        <label class="btn btn-ghost file-btn">
          画像を選択
          <input type="file" id="f-images" accept="image/*" multiple>
        </label>
        <span id="img-upload-status" style="font-size:11.5px;color:var(--text-dim);margin-left:8px;"></span>
        <div class="img-preview" id="img-preview"></div>
      </div>

      <h2 class="section-title" style="margin-top:22px;">結果</h2>
      <div class="row3">
        <div class="field">
          <label>結果</label>
          <select id="f-result">
            <option value="win">勝ち</option>
            <option value="lose">負け</option>
            <option value="be">引き分け</option>
          </select>
        </div>
        <div class="field"><label>R倍率</label><input type="number" step="any" id="f-r"></div>
        <div class="field"><label>損益額（任意）</label><input type="number" step="any" id="f-pnl"></div>
      </div>
      <div class="field"><label>メモ</label><input type="text" id="f-memo" placeholder="気づき・改善点など"></div>

      <div id="edit-banner" style="display:none;background:rgba(242,196,110,0.12);border:1px solid rgba(242,196,110,0.35);color:var(--be);padding:10px 14px;border-radius:8px;font-size:12.5px;margin-top:6px;">✏️ この記録を編集中です。保存すると上書きされます。</div>

      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-primary" id="btn-save-trade">この記録を保存</button>
        <button class="btn btn-ghost" id="btn-clear-form">クリア</button>
      </div>
    </div>
  </div>

  <!-- ================= HISTORY ================= -->
  <div class="view" id="view-history">
    <div class="filters">
      <select id="fil-account"><option value="">全口座</option></select>
      <select id="fil-result"><option value="">全結果</option><option value="win">勝ち</option><option value="lose">負け</option><option value="be">引き分け</option></select>
    </div>
    <div id="trade-list"></div>
  </div>

  <!-- ================= STATS ================= -->
  <div class="view" id="view-stats">
    <h2 class="section-title">口座別サマリー</h2>
    <div class="stat-grid" id="stat-grid"></div>

    <div class="chart-card">
      <div class="chart-head">
        <h3>口座残高推移</h3>
        <div class="legend" id="bal-legend"></div>
      </div>
      <div class="bal-controls">
        <div class="bal-field"><label>開始残高（プロップ50k想定）</label><input type="number" id="bal-start" value="50000" step="1000"></div>
        <div class="bal-field"><label>1トレードのリスク%（R入力時の換算用）</label><input type="number" id="bal-risk" value="1" step="0.1"></div>
      </div>
      <div class="tags" id="bal-acc-picker" style="margin-bottom:12px;"></div>
      <svg id="bal-svg" width="100%" height="280" viewBox="0 0 1000 280" preserveAspectRatio="none"></svg>
    </div>

    <div class="chart-card">
      <div class="cal-header">
        <button class="cal-nav-btn" id="cal-prev">‹</button>
        <h3 id="cal-month-label" style="margin:0;font-size:14px;"></h3>
        <button class="cal-nav-btn" id="cal-next">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <h3>累積R推移（エクイティカーブ）</h3>
        <div class="legend" id="curve-legend"></div>
      </div>
      <svg id="curve-svg" width="100%" height="280" viewBox="0 0 1000 280" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <!-- ================= ACCOUNTS ================= -->
  <div class="view" id="view-accounts">
    <h2 class="section-title">口座管理</h2>
    <div id="acc-list"></div>
    <button class="btn btn-primary" id="btn-add-acc" style="margin-top:8px;">口座を追加</button>

    <h2 class="section-title" style="margin-top:30px;">バックアップ</h2>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-ghost" id="btn-export">JSONエクスポート</button>
      <label class="btn btn-ghost" style="position:relative;overflow:hidden;">
        JSONインポート
        <input type="file" id="import-file" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      </label>
    </div>
  </div>

  <footer>データはこのブラウザの localStorage に保存されます。他端末とは共有されません。</footer>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src=""></div>

<script>
/* ==================== State ==================== */
const PALETTE = ["#5EC8F2","#F2A65E","#B98CF2","#7CE07A","#F27C9E","#7CD9E0"];

/* ---- Supabase cloud sync ---- */
const SUPABASE_URL = 'https://ebwextqywjlpdkhxnrnb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cNKK0SKH_4fIRoGtfn2Ryg_fMlfwtr0';
const sb = (typeof window.supabase !== 'undefined')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

async function cloudPush(id, payload){
  if(!sb) return;
  try{
    const { error } = await sb.from('trades_data').upsert({ id, payload, updated_at: new Date().toISOString() });
    if(error) console.error('cloud push error:', error);
  }catch(e){ console.error('cloud push exception:', e); }
}

async function cloudPull(id){
  if(!sb) return null;
  try{
    const { data, error } = await sb.from('trades_data').select('payload').eq('id', id).maybeSingle();
    if(error){ console.error('cloud pull error:', error); return null; }
    return data ? data.payload : null;
  }catch(e){ console.error('cloud pull exception:', e); return null; }
}

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function save(key, val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){
    alert('保存に失敗しました。ブラウザの保存容量がいっぱいの可能性が高いです。\n\n・スクリーンショットの枚数/サイズを減らす\n・不要な記録を削除する\n・JSONエクスポートでバックアップしてから、使わなくなった記録を消す\n\nこれらを試してから、もう一度保存してください。');
    return false;
  }
  const cloudId = key === 'tj_accounts' ? 'accounts' : key === 'tj_trades' ? 'trades' : null;
  if(cloudId) cloudPush(cloudId, val); // fire-and-forget cloud sync; localStorage is already saved above
  return true;
}

// migrate trades from older versions of this app into the current flat, single-account-per-trade shape
function migrateTrade(t){
  if(t.accountId !== undefined) return t;
  const fallbackAccId = accounts[0] ? accounts[0].id : null;
  if(t.results){
    // very old multi-account "SL comparison" format
    const firstKey = Object.keys(t.results)[0];
    const r = firstKey ? t.results[firstKey] : null;
    return {
      id: t.id,
      accountId: firstKey || fallbackAccId,
      date: t.date,
      direction: t.direction || 'long',
      rationale: t.rationale || '',
      images: t.images || [],
      result: r ? r.result : 'be',
      r: r ? r.r : null,
      pnl: r ? r.pnl : null,
      memo: r ? r.memo : ''
    };
  }
  // flat single-stream format (no account concept yet)
  return { ...t, accountId: fallbackAccId };
}

async function uploadImageToStorage(file){
  if(!sb) throw new Error('Supabaseクライアントが初期化されていません');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `img_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from('screenshots').upload(path, file, { cacheControl: '3600', upsert: false });
  if(error) throw error;
  const { data: pub } = sb.storage.from('screenshots').getPublicUrl(path);
  return pub.publicUrl;
}

/* ==================== Stats ==================== */
function computeAccountStats(accId){
  const rows = trades.filter(t=>t.accountId===accId);
  const total = rows.length;
  const wins = rows.filter(r=>r.result==='win').length;
  const losses = rows.filter(r=>r.result==='lose').length;
  const rVals = rows.filter(r=>r.r!=null).map(r=>r.r);
  const totalR = rVals.reduce((a,b)=>a+b,0);
  const avgR = rVals.length ? totalR/rVals.length : 0;
  const grossWin = rVals.filter(r=>r>0).reduce((a,b)=>a+b,0);
  const grossLoss = Math.abs(rVals.filter(r=>r<0).reduce((a,b)=>a+b,0));
  const pf = grossLoss>0 ? grossWin/grossLoss : (grossWin>0 ? Infinity : 0);
  const winRate = total>0 ? wins/total*100 : 0;
  const pnlVals = rows.filter(r=>r.pnl!=null).map(r=>r.pnl);
  const totalPnl = pnlVals.reduce((a,b)=>a+b,0);
  const hasPnl = pnlVals.length > 0;
  const sorted = [...rows].sort((a,b)=>a.date.localeCompare(b.date));
  let cum = 0;
  const curve = sorted.map(r=>{ cum += (r.r||0); return cum; });
  return {total, wins, losses, winRate, totalR, avgR, pf, totalPnl, hasPnl, curve};
}

function renderBalanceChart(){
  const startBal = parseFloat(document.getElementById('bal-start').value) || 50000;
  const riskPct = parseFloat(document.getElementById('bal-risk').value) || 1;
  const riskAmt = startBal * (riskPct / 100);

  const svg = document.getElementById('bal-svg');
  svg.innerHTML = '';
  const legend = document.getElementById('bal-legend');
  const selectedAccs = accounts.filter(a => balSelectedAccounts.has(a.id));
  legend.innerHTML = selectedAccs.map(a=>`<span><span class="dot" style="background:${a.color}"></span>${escapeHtml(a.name)}</span>`).join('');

  const W=1000, H=280, PAD=44;

  const curves = {};
  selectedAccs.forEach(acc=>{
    const rows = trades.filter(t=>t.accountId===acc.id);
    const sorted = [...rows].sort((a,b)=>a.date.localeCompare(b.date));
    let bal = startBal;
    const pts = [bal];
    sorted.forEach(r=>{
      let delta = 0;
      if(r.pnl != null) delta = r.pnl;
      else if(r.r != null) delta = r.r * riskAmt;
      bal += delta;
      pts.push(bal);
    });
    curves[acc.id] = pts;
  });

  if(selectedAccs.length === 0){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', W/2); t.setAttribute('y', H/2);
    t.setAttribute('fill','#565D70'); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','14');
    t.textContent = '口座を選択してください';
    svg.appendChild(t);
    return;
  }

  let allVals = [startBal];
  Object.values(curves).forEach(pts=>pts.forEach(v=>allVals.push(v)));
  const maxV = Math.max(...allVals), minV = Math.min(...allVals);
  const range = (maxV - minV) || (startBal * 0.1) || 1;
  const yMax = maxV + range*0.12, yMin = minV - range*0.12;
  const yFor = v => H-PAD - ((v-yMin)/((yMax-yMin)||1))*(H-PAD*2);

  const baseY = yFor(startBal);
  const baseLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  baseLine.setAttribute('x1', PAD); baseLine.setAttribute('x2', W-8);
  baseLine.setAttribute('y1', baseY); baseLine.setAttribute('y2', baseY);
  baseLine.setAttribute('stroke', '#2B3140'); baseLine.setAttribute('stroke-dasharray','4,4');
  svg.appendChild(baseLine);

  const baseLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  baseLabel.setAttribute('x', PAD); baseLabel.setAttribute('y', baseY - 8);
  baseLabel.setAttribute('fill', '#565D70'); baseLabel.setAttribute('font-size', '11'); baseLabel.setAttribute('font-family','var(--font-m)');
  baseLabel.textContent = '開始 $' + startBal.toLocaleString();
  svg.appendChild(baseLabel);

  const maxLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  maxLabel.setAttribute('x', PAD); maxLabel.setAttribute('y', yFor(maxV) - 8 < 12 ? 12 : yFor(maxV) - 8);
  maxLabel.setAttribute('fill', '#565D70'); maxLabel.setAttribute('font-size', '11'); maxLabel.setAttribute('font-family','var(--font-m)');
  maxLabel.textContent = '最大 $' + Math.round(maxV).toLocaleString();
  svg.appendChild(maxLabel);

  const minLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  minLabel.setAttribute('x', PAD); minLabel.setAttribute('y', Math.min(yFor(minV) + 16, H-6));
  minLabel.setAttribute('fill', '#565D70'); minLabel.setAttribute('font-size', '11'); minLabel.setAttribute('font-family','var(--font-m)');
  minLabel.textContent = '最小 $' + Math.round(minV).toLocaleString();
  svg.appendChild(minLabel);

  selectedAccs.forEach(acc=>{
    const pts = curves[acc.id];
    const n = pts.length;
    const xStep = n>1 ? (W-PAD-10)/(n-1) : 0;
    let d = `M ${PAD} ${yFor(pts[0])} `;
    pts.forEach((v,i)=>{ d += `L ${PAD + i*xStep} ${yFor(v)} `; });
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', acc.color);
    path.setAttribute('stroke-width','2.5');
    path.setAttribute('stroke-linejoin','round');
    svg.appendChild(path);

    const lastV = pts[pts.length-1];
    const endLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
    endLabel.setAttribute('x', Math.min(PAD+(n-1)*xStep, W-6)); endLabel.setAttribute('y', Math.max(14, yFor(lastV)-8));
    endLabel.setAttribute('fill', acc.color); endLabel.setAttribute('font-size','12'); endLabel.setAttribute('font-weight','700');
    endLabel.setAttribute('text-anchor','end'); endLabel.setAttribute('font-family','var(--font-m)');
    endLabel.textContent = '$' + Math.round(lastV).toLocaleString();
    svg.appendChild(endLabel);
  });
}

/* ---- Daily calendar: $ pnl, win/loss, R per day ---- */
function renderCalendar(){
  const label = document.getElementById('cal-month-label');
  const grid = document.getElementById('cal-grid');
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  label.textContent = `${year}年${month+1}月`;

  const selectedIds = balSelectedAccounts;
  const dayData = {};
  trades.forEach(t=>{
    if(!selectedIds.has(t.accountId)) return;
    if(!dayData[t.date]) dayData[t.date] = {pnl:0, r:0, win:0, lose:0, be:0, hasPnl:false, hasR:false};
    const d = dayData[t.date];
    if(t.pnl != null){ d.pnl += t.pnl; d.hasPnl = true; }
    if(t.r != null){ d.r += t.r; d.hasR = true; }
    if(t.result === 'win') d.win++;
    else if(t.result === 'lose') d.lose++;
    else d.be++;
  });

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  grid.innerHTML = '';
  ['日','月','火','水','木','金','土'].forEach(w=>{
    const cell = document.createElement('div');
    cell.className = 'cal-weekday';
    cell.textContent = w;
    grid.appendChild(cell);
  });
  for(let i=0;i<startWeekday;i++){
    const blank = document.createElement('div');
    blank.className = 'cal-cell cal-blank';
    grid.appendChild(blank);
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const d = dayData[dateStr];
    let cls = 'cal-cell';
    if(d){
      const net = d.hasPnl ? d.pnl : d.r;
      if(net > 0) cls += ' cal-pos';
      else if(net < 0) cls += ' cal-neg';
    }
    const cell = document.createElement('div');
    cell.className = cls;
    let inner = `<div class="cal-day-num">${day}</div>`;
    if(d){
      if(d.hasPnl) inner += `<div class="cal-pnl">${d.pnl>0?'+':''}${Math.round(d.pnl).toLocaleString()}</div>`;
      if(d.hasR) inner += `<div class="cal-r">${d.r>0?'+':''}${d.r.toFixed(1)}R</div>`;
      const wlParts = [];
      if(d.win) wlParts.push(d.win+'勝');
      if(d.lose) wlParts.push(d.lose+'敗');
      if(d.be) wlParts.push(d.be+'分');
      inner += `<div class="cal-wl">${wlParts.join('')}</div>`;
    }
    cell.innerHTML = inner;
    grid.appendChild(cell);
  }
}

/* ---- Cumulative R curve (per account) ---- */
function renderCurveChart(statsByAcc){
  const svg = document.getElementById('curve-svg');
  const legend = document.getElementById('curve-legend');
  svg.innerHTML = '';
  legend.innerHTML = accounts.map(a=>`<span><span class="dot" style="background:${a.color}"></span>${escapeHtml(a.name)}</span>`).join('');

  const W=1000,H=280,PAD=34;
  let allVals = [0];
  accounts.forEach(a=>{ statsByAcc[a.id].curve.forEach(v=>allVals.push(v)); });
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals, -1);
  const range = (maxV-minV) || 1;
  const padRange = range * 0.12;
  const yTop = maxV + padRange, yBottom = minV - padRange;

  const yFor = v => H-PAD - ((v-yBottom)/((yTop-yBottom)||1))*(H-PAD*2);
  const zeroY = yFor(0);
  const zeroLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  zeroLine.setAttribute('x1',PAD); zeroLine.setAttribute('x2',W-8);
  zeroLine.setAttribute('y1',zeroY); zeroLine.setAttribute('y2',zeroY);
  zeroLine.setAttribute('stroke','#2B3140'); zeroLine.setAttribute('stroke-dasharray','4,4');
  svg.appendChild(zeroLine);

  const maxLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  maxLabel.setAttribute('x', PAD); maxLabel.setAttribute('y', yFor(maxV) - 8 < 12 ? 12 : yFor(maxV) - 8);
  maxLabel.setAttribute('fill','#565D70'); maxLabel.setAttribute('font-size','11'); maxLabel.setAttribute('font-family','var(--font-m)');
  maxLabel.textContent = '最大 ' + (maxV>0?'+':'') + maxV.toFixed(2) + 'R';
  svg.appendChild(maxLabel);

  const minLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  minLabel.setAttribute('x', PAD); minLabel.setAttribute('y', Math.min(yFor(minV) + 16, H-6));
  minLabel.setAttribute('fill','#565D70'); minLabel.setAttribute('font-size','11'); minLabel.setAttribute('font-family','var(--font-m)');
  minLabel.textContent = '最小 ' + (minV>0?'+':'') + minV.toFixed(2) + 'R';
  svg.appendChild(minLabel);

  let hasAny = false;
  accounts.forEach(a=>{
    const curve = statsByAcc[a.id].curve;
    if(curve.length===0) return;
    hasAny = true;
    const n = curve.length;
    const xStep = n>1 ? (W-PAD-10)/(n-1) : 0;
    let d = `M ${PAD} ${yFor(0)} `;
    curve.forEach((v,i)=>{ d += `L ${PAD + i*xStep} ${yFor(v)} `; });
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', a.color);
    path.setAttribute('stroke-width','2.5');
    path.setAttribute('stroke-linejoin','round');
    svg.appendChild(path);

    const lastV = curve[curve.length-1];
    const endLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
    endLabel.setAttribute('x', Math.min(PAD+(n-1)*xStep, W-6)); endLabel.setAttribute('y', Math.max(14, yFor(lastV)-8));
    endLabel.setAttribute('fill', a.color); endLabel.setAttribute('font-size','12'); endLabel.setAttribute('font-weight','700');
    endLabel.setAttribute('text-anchor','end'); endLabel.setAttribute('font-family','var(--font-m)');
    endLabel.textContent = (lastV>0?'+':'') + lastV.toFixed(2) + 'R';
    svg.appendChild(endLabel);
  });

  if(!hasAny){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', W/2); t.setAttribute('y', H/2);
    t.setAttribute('fill','#565D70'); t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','14');
    t.textContent = 'まだデータがありません';
    svg.appendChild(t);
  }
}

/* ==================== Accounts tab ==================== */
function renderAccountsTab(){
  const list = document.getElementById('acc-list');
  list.innerHTML = '';
  accounts.forEach(acc=>{
    const row = document.createElement('div');
    row.className = 'acc-row';
    row.innerHTML = `
      <div class="swatch-picker">
        ${PALETTE.map(c=>`<div class="swatch" data-color="${c}" style="background:${c};${c===acc.color?'box-shadow:0 0 0 2px #fff;':''}"></div>`).join('')}
      </div>
      <input type="text" value="${escapeHtml(acc.name)}" data-role="name">
      <input type="text" value="${escapeHtml(acc.note||'')}" data-role="note" placeholder="口座メモ">
      <button class="btn btn-danger btn-sm" data-role="del">削除</button>
    `;
    row.querySelectorAll('.swatch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        acc.color = sw.dataset.color;
        save('tj_accounts', accounts);
        renderAccountsTab();
      });
    });
    row.querySelector('[data-role="name"]').addEventListener('change', e=>{
      acc.name = e.target.value.trim() || acc.name;
      save('tj_accounts', accounts);
      populateAccountSelect();
    });
    row.querySelector('[data-role="note"]').addEventListener('change', e=>{
      acc.note = e.target.value.trim();
      save('tj_accounts', accounts);
    });
    row.querySelector('[data-role="del"]').addEventListener('click', ()=>{
      if(accounts.length<=1){ alert('口座は最低1つ必要です。'); return; }
      const tradeCount = trades.filter(t=>t.accountId===acc.id).length;
      const msg = tradeCount>0
        ? `「${acc.name}」を削除しますか？\nこの口座に紐づく記録が${tradeCount}件ありますが、記録自体は削除されず「口座不明」として履歴に残ります。`
        : `「${acc.name}」を削除しますか？`;
      if(!confirm(msg)) return;
      accounts = accounts.filter(a=>a.id!==acc.id);
      balSelectedAccounts.delete(acc.id);
      save('tj_accounts', accounts);
      renderAccountsTab();
      populateAccountSelect();
    });
    list.appendChild(row);
  });
}

document.getElementById('btn-add-acc').addEventListener('click', ()=>{
  const name = prompt('新しい口座名を入力してください', '新規口座');
  if(!name) return;
  const color = PALETTE[accounts.length % PALETTE.length];
  const newAcc = {id:'acc_'+Date.now(), name: name.trim(), note:'', color};
  accounts.push(newAcc);
  balSelectedAccounts.add(newAcc.id);
  save('tj_accounts', accounts);
  renderAccountsTab();
  populateAccountSelect();
});

/* ==================== Backup ==================== */
document.getElementById('btn-export').addEventListener('click', ()=>{
  const data = JSON.stringify({accounts, trades}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `trade-journal-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('現在のデータを上書きしてインポートしますか？')) return;
      if(data.accounts){
        accounts = data.accounts;
        save('tj_accounts', accounts);
        balSelectedAccounts = new Set(accounts.map(a=>a.id));
      }
      if(data.trades){
        trades = data.trades.map(migrateTrade);
        save('tj_trades', trades);
      }
      renderAccountsTab();
      populateAccountSelect();
      alert('インポートしました。');
    }catch(err){
      alert('ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。');
    }
  };
  reader.readAsText(file);
});

/* ---- Pull latest data from Supabase on load, then re-render if it differs from the local cache ---- */
async function bootstrapCloud(){
  const [cloudAccounts, cloudTrades] = await Promise.all([cloudPull('accounts'), cloudPull('trades')]);

  if(cloudAccounts){
    accounts = cloudAccounts;
    localStorage.setItem('tj_accounts', JSON.stringify(accounts));
  } else {
    cloudPush('accounts', accounts); // first run: seed the cloud with local defaults
  }

  if(cloudTrades){
    trades = cloudTrades.map(migrateTrade);
    localStorage.setItem('tj_trades', JSON.stringify(trades));
  } else {
    cloudPush('trades', trades);
  }

  balSelectedAccounts = new Set(accounts.map(a=>a.id));
  populateAccountSelect();

  const activeView = document.querySelector('.view.active');
  if(activeView){
    if(activeView.id === 'view-history') renderHistory();
    if(activeView.id === 'view-stats') renderStats();
    if(activeView.id === 'view-accounts') renderAccountsTab();
  }
}
bootstrapCloud();
